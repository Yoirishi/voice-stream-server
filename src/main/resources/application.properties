quarkus.application.name=voice-stream-server

quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=${DB_USERNAME:voice_stream}
%dev.quarkus.datasource.password=${DB_PASSWORD:voice_stream}
%dev.quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/voice_stream}
%dev.quarkus.datasource.devservices.enabled=false
%prod.quarkus.datasource.username=${DB_USERNAME:voice_stream}
%prod.quarkus.datasource.password=${DB_PASSWORD:voice_stream}
%prod.quarkus.datasource.jdbc.url=${DB_JDBC_URL}
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:18.3
%test.quarkus.datasource.devservices.db-name=voice_stream_test
%test.quarkus.datasource.devservices.username=voice_stream
%test.quarkus.datasource.devservices.password=voice_stream

quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-migration-naming=true

quarkus.hibernate-orm.schema-management.strategy=none

quarkus.smallrye-graphql.ui.always-include=true
# SmallRye GraphQL logs every resolver exception in dev/test by default, even when it is
# intentionally transformed into a GraphQL errors[] entry. Keep console output clean.
%dev.quarkus.smallrye-graphql.print-data-fetcher-exception=false
%test.quarkus.smallrye-graphql.print-data-fetcher-exception=false

voice-stream.auth.token-secret=${AUTH_TOKEN_SECRET:dev-auth-token-secret-change-me}
voice-stream.auth.access-token-ttl-seconds=${AUTH_ACCESS_TOKEN_TTL_SECONDS:900}
voice-stream.auth.refresh-token-ttl-seconds=${AUTH_REFRESH_TOKEN_TTL_SECONDS:2592000}
voice-stream.auth.password-hash-iterations=${AUTH_PASSWORD_HASH_ITERATIONS:210000}
voice-stream.auth.session-cookie-name=${AUTH_SESSION_COOKIE_NAME:voice_stream_session}
voice-stream.auth.session-cookie-path=${AUTH_SESSION_COOKIE_PATH:/}
voice-stream.auth.session-cookie-secure=${AUTH_SESSION_COOKIE_SECURE:false}
voice-stream.auth.session-cookie-same-site=${AUTH_SESSION_COOKIE_SAME_SITE:Lax}
voice-stream.auth.session-cookie-encryption-key=${AUTH_SESSION_COOKIE_ENCRYPTION_KEY:dev-session-cookie-encryption-key-change-me-please}

voice-stream.media.sfu-provider=${MEDIA_SFU_PROVIDER:external-webrtc-sfu}
voice-stream.media.sfu-url=${MEDIA_SFU_URL:ws://localhost:7880}
voice-stream.media.signaling-url=${MEDIA_SIGNALING_URL:ws://localhost:8080/ws/signaling}
voice-stream.media.token-secret=${MEDIA_TOKEN_SECRET:dev-media-token-secret-change-me}
voice-stream.media.token-ttl-seconds=${MEDIA_TOKEN_TTL_SECONDS:600}
